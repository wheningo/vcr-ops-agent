[project]
name = "vcr-ops-agent"
version = "0.1.0"
description = "虚拟语聊房运营 Agent — LangGraph Supervisor + 专家 Agent，自动化巡检→根因分析决策链"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.1",
    "langchain>=0.3.25",
    "langchain-anthropic>=0.3.12",
    "pydantic>=2.11.4",
    "structlog>=25.4.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.12",
    "pyyaml>=6.0.3",
]

[project.scripts]
vcr-ops = "vcr_ops_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcr_ops_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"